name: business-impact-estimator
description: Estimates financial and business loss from an incident or outage by combining knowledge graph product data and business metrics.
instructions: |
  Given an incident or outage context, estimate the business impact in
  EUR. Combine knowledge graph product data (tier, team) with business
  metrics. Consider affected user journeys, revenue per hour, and SLO
  breach severity. Produce a structured estimate with confidence range.
