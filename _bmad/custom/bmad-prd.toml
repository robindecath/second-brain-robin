# Team overrides for bmad-prd — Product Requirements Document workflow
# Merged on top of .agents/skills/bmad-prd/customize.toml
# Scalar values override defaults; arrays append to defaults.

[workflow]

activation_steps_prepend = [
  "Invoke `decathlon-tech-radar` to load Decathlon technology classification rules (ADOPT / TRIAL / ASSESS / HOLD). Any technology choices or constraints surfaced during PRD discovery must be validated against the radar before being included in requirements.",
]

persistent_facts = [
  "When a PRD request requires customer-facing UI copy, microcopy, content hierarchy, screen information architecture, user-flow wording, or content constraints, invoke `content-design` for that work. PRDs should capture the user need, content purpose, placement, audience, and any component/character constraints; do not invent final UX copy where the skill's context is missing. Apply UK English, accessible user-focused language, consistent terminology, and actionable recovery guidance. The skill excludes marketing, slogans, legal/compliance copy, and translation/localisation; direct those to the relevant human specialist.",
  "`ux-research` is Decathlon's canonical and MANDATORY UX research methodology, and it is exclusive for this phase: every user need, pain point, persona, journey, job-to-be-done, How-Might-We statement, or opportunity that enters the PRD must be produced or validated through the `ux-research` skill, using its references and templates. Do not adopt another discovery framework, improvise a research plan, or invent a persona/journey format — even if the alternative looks equivalent.",
  "Every user-evidence claim in a PRD ships with its trail: source citation, triangulation status, confidence grade, and sample limits, per `ux-research`. Never fabricate a quote, participant, statistic, or persona; never present a directional small-sample qualitative signal as a measurement (no \"4 out of 6 users\"); never name or make a participant identifiable. Minority and contradictory evidence keeps a named place in the PRD rather than being averaged into the majority narrative.",
  "Where a requirement rests on an unevidenced user assumption, write it down as an explicit assumption with an open question and scope a `ux-research` study to resolve it — a low-confidence finding produces a test or experiment in the roadmap, not a committed build. Keep the ux-research vocabulary distinct: observation, interpretation, insight, opportunity, recommendation; requirements sit on insights and opportunities, not raw observations.",
  "RENDERING RULE: PRD, persona, journey, JTBD, HMW and OST artefacts are markdown deliverables and stay markdown — no design system applies. But if you build a NEW web deliverable off the back of them (HTML page, interactive prototype, browser-served deck, shareout microsite), it becomes a Decathlon web surface: it must be built with `web-ui-development` using Vitamin Play components and design tokens, and respect WCAG 2.2 AA / RGAA. Artefacts BMAD produces by default are out of scope — do not restyle them.",
  "All new Decathlon products must be registered in AppReferential after launch with correct domain, tiering (Tier-1 = business-critical), and team ownership. PRDs for new products should include an AppReferential registration step in the delivery checklist.",
  "PRDs for products that impact User Journeys must include SLO baseline requirements (availability, latency) so the architecture and SRE phases can define concrete SLI/SLO definitions.",
  "Technology choices proposed in the PRD must comply with the Decathlon Tech Radar. HOLD (Forbidden or Legacy) technologies must not be included as requirements.",
  "For a new project with at least two distinct technical surfaces among specifications, frontend, and backend that have different frameworks or lifecycles, recommend a repository split and capture the decision in the PRD. Prefer `<product>-specs` when specifications need an independent lifecycle, `<product>-front` for the complete frontend, and `<product>-back` for the complete backend. SIG Delivery recommends aiming for a single-framework monorepo per code surface: full frontend or full backend, not both in one repository. Treat this as non-blocking guidance, keep a narrow single-framework project in one repository by default, and document any justified alternative topology or naming.",
  "Once the user accepts the repository recommendation, explain that the already-installed `gh` CLI can create repositories and update their settings or metadata. Offer that assistance, but require explicit confirmation before mutating any repository.",
]

# On-demand knowledge sources consulted during PRD discovery and drafting.
# The LLM consults these when the conversation surfaces a matching need.
external_sources = [
  "When PRD discovery or drafting requires creating, reviewing, or improving customer-facing UI copy, microcopy, content hierarchy, screen information architecture, user-flow wording, or copy variants, invoke `content-design` and follow its scope and quality guidance. Keep product requirements distinct from final copy where context is incomplete; exclude marketing, slogans, legal/compliance copy, and translation/localisation. If the skill is not installed, stop and tell the user to run: `npx skills add dktunited/agent-skills --skill content-design`",
  "MANDATORY routing: whenever PRD discovery touches user evidence — research plans, user interviews, usability testing, surveys, participant recruitment, research synthesis, personas, journey maps, jobs-to-be-done, How-Might-We statements, opportunity mapping, or whether a finding is strong enough to act on — invoke `ux-research` and follow its workflow and templates rather than answering from general product knowledge or proposing another framework. If the skill is not installed, stop and tell the user to run: `npx skills add dktunited/agent-skills --skill ux-research`",
  "When you build a NEW web deliverable off the back of a PRD-phase artefact (HTML page, interactive prototype, browser-served deck, shareout microsite), consult `web-ui-development` so it is built with Vitamin Play components and design tokens and respects WCAG 2.2 AA / RGAA. Markdown deliverables are exempt, and artefacts BMAD produces by default are out of scope — leave them as generated.",
  "When the user mentions an external tool or platform — or asks about available MCPs — invoke `decathlon-find-mcp-server`. If the skill is not installed, tell the user to run: `npx skills add dktunited/ai-augmented-sdlc --skill decathlon-find-mcp-server`",
  "When the user asks about AI Augmented Development at Decathlon — GitHub Copilot usage, billing or quota, the AI Augmented SDLC platform, coding standards, agent skills, MCP servers, trainings, talks or monthly community calls — consult the official documentation via `decathlon-ai-augmented-development-docs`, which reads the versioned `llms-full.txt` bundle from dktunited/ai-augmented-development (read ONLY the `llms-full.txt` files — never the link-only `llms.txt`/`llms-pages.txt` indexes, which point back to the login-gated site). If the skill is not installed, tell the user to run: `npx skills add dktunited/ai-augmented-sdlc --skill decathlon-ai-augmented-development-docs`",
  "When the PRD references any existing Decathlon product, service, API, domain, or component by name, consult `knowledge-graph-query` to verify its current state, ownership, business tiering, and documentation links before including integration assumptions.",
  "When scoping commercial or revenue-impacting features, consult `business-data` to retrieve GMV reference data and business impact baselines to ground business-value claims.",
  "When the PRD references Decathlon User Journeys (UJ) or cross-product performance requirements, consult `delivery-metrics` to retrieve current UJ SLO baselines and benchmarks.",
  "When the PRD implies a need to call or integrate with an internal capability without naming a specific API (e.g. 'we need to check stock', 'we need order status'), consult `decathlon-api-discovery` to check whether an existing Decathlon API/endpoint already covers it before requiring a new one to be built.",
  "When the PRD describes a UI or user-facing flow that will display product images, lifestyle photography, campaign visuals, or other Decathlon media, consult `decathlon-pixl-search` to verify that the needed assets already exist in PixL DAM — this validates feasibility and prevents the design phase from starting with unrealistic asset assumptions.",
]
