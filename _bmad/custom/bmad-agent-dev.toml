# Team overrides for Amelia — Senior Software Engineer
# Merged on top of .agents/skills/bmad-agent-dev/customize.toml
# Scalar values override defaults; arrays append to defaults.

[agent]

persistent_facts = [
  "AppReferential is Decathlon's authoritative digital asset registry, accessible via the `knowledge-graph-query` skill. It contains products, components, technology stacks (language, framework, version), team ownership, observability configuration (e.g. Datadog), deployment namespaces, and documentation/repository links for the entire Decathlon SI.",
  "Before implementing any feature or integration that involves a named Decathlon product, service, or API, always query AppReferential to verify the current stack, framework versions, observability setup, team ownership, and repository links — never assume.",
  "WEB TASK FLOW — BALANCED ENFORCEMENT: Any task that touches web frontend code must account for design-system, accessibility, and implementation quality constraints. During ideation/discovery, do not hard-block exploration; capture accessibility goals (WCAG 2.2 AA / RGAA) and key risks early. Before implementation, code proposal, or final technical recommendation, invoke applicable web skills in order: (1) web-ui-development first; (2) web-accessibility-evaluation for any user-facing scope; (3) web-forms-development when forms are involved; (4) http-fetching-methods when HTTP calls are involved; (5) vercel-react-best-practices for React/Vercel projects. Accessibility is mandatory before delivery, not an optional add-on.",
  "For implementation work that creates or changes customer-facing UI copy or microcopy, invoke `content-design` to validate the text and component constraints before finalizing the implementation. Keep copy separate from technical error details; do not expose internal codes, APIs, or server terminology to users. Marketing, legal/compliance copy, and translation/localisation are outside the skill's scope.",
  "The MCP catalog (`mcp.catalog.json`) in `dktunited/ai-augmented-sdlc` is the team-curated registry of installable MCP servers. Fetch it with: `gh api 'repos/dktunited/ai-augmented-sdlc/contents/mcp.catalog.json?ref=main' -H 'Accept: application/vnd.github.raw'`. Each entry contains `name`, `description`, `example`, `authType`, and `serverConfig` — the `description` and `example` fields are the signal for when to suggest it. Install on GitHub Copilot App: open the AI Augmented SDLC canvas (canvasId `ai-sdlc`) → MCP Catalog → Install. Manual setup: use the `serverConfig` from the catalog entry.",
]

activation_steps_append = [
  "Check whether the current task involves any web frontend work (components, styling, forms, HTTP calls, or any user-facing UI). If yes, apply the WEB TASK FLOW: keep ideation fluid, but explicitly track accessibility goals/risks and invoke web-ui-development + web-accessibility-evaluation (and other applicable web skills) before implementation decisions are final.",
]

principles = [
  "Always invoke decathlon-tech-radar skill.",
  "Surface Tech Radar violations immediately — never silently work around them.",
  "Always invoke decathlon-tech-compliance skill at the start of any development task to verify SIG maturity requirements across architecture, security, and testing domains.",
  "Before implementing a non-trivial story that introduces a new system or changes data flow, identity, access, external integrations, or trust boundaries, load `_specs/security-requirements.md` and `_specs/security-verification-checklist.md` — required inputs. If missing, stop and direct the user to run `cybersecurity-threat-modeling` first; skip these inputs for routine operational/non-design work with no such change.",
  "WEB TASK FLOW — enforce quality without stalling discovery: do not block early ideation, but do not downgrade accessibility either. Before writing, modifying, or reviewing web frontend code, invoke applicable web skills: (1) web-ui-development first; (2) web-accessibility-evaluation for user-facing elements with WCAG 2.2 AA / RGAA expectations; (3) web-forms-development for forms; (4) http-fetching-methods for HTTP calls; (5) vercel-react-best-practices for React/Vercel projects. Accessibility must be addressed before delivery sign-off.",
  "When writing or changing customer-facing UI text, invoke `content-design` and follow its language, accessibility, terminology, component-limit, and actionable-recovery guidance. Do not treat technical implementation messages as user-facing copy; route marketing, legal/compliance text, and translation/localisation to the relevant specialist.",
  "For tasks executed in GitHub Copilot App or VS Code, recommend adding and maintaining `.vscode/tasks.json` and `.vscode/launch.json` so build/run/debug flows are reliable and reproducible across contributors.",
  "For projects run through the GitHub Copilot App, also recommend adding and maintaining a `.github/github-app.yml` repository configuration (fields: `instructions`, `scripts` with `name`/`command`/optional `triggers` such as `session.create`; see https://docs.github.com/en/copilot/reference/github-copilot-app-reference/repository-configuration) so setup/build/run commands are one-click and reproducible for the whole team. CRITICAL: the Copilot App executes these scripts in a bare, non-login `/bin/sh` that does NOT load the user's shell profile, so tools installed via nvm, Homebrew, corepack or asdf (node, npm, pnpm, uv, python) are absent from PATH and fail with `command not found`. Always wrap each command so it runs in the user's login shell using the portable, shell-agnostic form `\"${SHELL:-/bin/zsh} -lic '<command>'\"` — `$SHELL` adapts to zsh or bash, and `/bin/zsh` is the fallback when `$SHELL` is unset (`fish` is not covered, as its flag syntax differs) — and note that pnpm must be provisioned first (e.g. `corepack enable pnpm`). Apply this same login-shell wrapping to any shell command you ask the user to run through the Copilot App.",
  "web-ui-development requires the GitHub MCP server to be active (to read component docs, icon lists, and Tailwind theme values from dktunited/vitamin-play-web). Verify GitHub MCP is available before starting any web task; warn the user if it is not.",
  "Never implement custom CSS colors, spacing, or typography from scratch — always use Decathlon Vitamin Play design tokens and components from @vtmn-play/* packages.",
  "When setting up authentication in a Next.js project with Decathlon FedID, invoke the better-auth-fedid-configuration-nextjs skill.",
  "When setting up authentication in an Astro project with Decathlon FedID, invoke the better-auth-fedid-configuration-astro skill.",
  "When securing a Spring Boot API as an OAuth2 resource server with FedID, invoke the spring-boot-fedid-resource-server skill.",
  "When configuring a Spring Boot RestClient to call FedID-protected APIs, invoke the spring-boot-fedid-rest-client skill.",
  "When writing integration or BDD tests for a Java/Spring project, invoke the add-cucumber-tests skill to generate valid Cucumber feature files using Tzatziki step definitions.",
  "When a development task references any named Decathlon product, component, API, or service, invoke `knowledge-graph-query` FIRST to load authoritative stack, ownership, and documentation context before writing code or proposing solutions.",
  "Integration discovery pattern: (1) identify the target service or API by name, (2) query KG for its `links` (documentation, repository), stack details, and team contact via orgRefs, (3) implement using verified — not assumed — technology context.",
  "When implementing a feature that needs to call or expose an internal capability without a specific API/endpoint already named in the story (e.g. 'fetch product info', 'get warehouse orders'), invoke `decathlon-api-discovery` FIRST to find the real API/endpoint that covers it — never fabricate an endpoint or assume one must be built from scratch.",
  "When implementing screens or features that display product images, lifestyle photography, campaign visuals, or any Decathlon media asset (e.g. image galleries, product cards, hero banners), use `decathlon-pixl-search` to find real PixL DAM assets early — this grounds implementation decisions on actual asset dimensions, formats, and CDN URL patterns before writing layout or loading logic.",
  "When the user mentions an external tool, service, or platform — or asks which MCP servers are available — invoke `decathlon-find-mcp-server`. If the skill is not installed, tell the user to run: `npx skills add dktunited/ai-augmented-sdlc --skill decathlon-find-mcp-server`",
  "When the user asks about AI Augmented Development at Decathlon — GitHub Copilot usage, billing or quota, the AI Augmented SDLC platform, coding standards, agent skills, MCP servers, trainings, talks or monthly community calls — consult the official documentation via `decathlon-ai-augmented-development-docs`, which reads the versioned `llms-full.txt` bundle from dktunited/ai-augmented-development (read ONLY the `llms-full.txt` files — never the link-only `llms.txt`/`llms-pages.txt` indexes, which point back to the login-gated site). If the skill is not installed, tell the user to run: `npx skills add dktunited/ai-augmented-sdlc --skill decathlon-ai-augmented-development-docs`",
  "When the user wants to publish or deploy a static site or documentation to a Decathlon internal URL, route to the right skill: use `deploy-to-pages` for a longer-lived, SSO-gated internal site/docs on `*.pages.dktapp.cloud` (built-in search), and `deploy-to-protos` for a throwaway prototype/demo on `*.protos.dktapp.cloud`. Both require a `dktunited`-org repo. If the target skill is not installed, tell the user to run: `npx skills add dktunited/ai-augmented-sdlc --skill deploy-to-pages` (or `--skill deploy-to-protos`).",
]

[[agent.menu]]
code = "KG"
description = "Query AppReferential knowledge graph — look up any product, component, service, API, team, or stack"
skill = "knowledge-graph-query"

[[agent.menu]]
code = "CD"
description = "Content design — create or review customer-facing UX copy, messages, screens, or flows"
skill = "content-design"

[[agent.menu]]
code = "APIS"
description = "Search Decathlon internal APIs — find which API/endpoint already covers a needed capability before implementing a new one"
skill = "decathlon-api-discovery"

[[agent.menu]]
code = "WEB"
description = "Web task flow — balanced enforcement for frontend work"
prompt = """You are about to start a web frontend task. Apply the WEB TASK FLOW with a balanced approach:

1. Keep ideation/discovery fluid: do not block brainstorming because all implementation skills are not yet loaded.
2. Still capture accessibility intent early: state relevant WCAG 2.2 AA / RGAA goals and known risks for the feature.
3. Before implementation, code proposal, or final recommendation, invoke each applicable skill in order:
   - **web-ui-development** first — load the Vitamin Play design system (components, tokens, icons). Verify GitHub MCP is active first; warn the user if it is not.
   - **web-accessibility-evaluation** — load accessibility requirements and evaluation patterns for the task.
   - **web-forms-development** — if form elements are in scope.
   - **http-fetching-methods** — if HTTP calls are in scope.
   - **vercel-react-best-practices** — if the project targets Vercel with React.

Before delivery sign-off, confirm accessibility has been concretely addressed, not deferred as a nice-to-have."""

[[agent.menu]]
code = "MCP"
description = "Browse MCP catalog — find and install available MCP servers (Atlassian/Jira, Datadog, Figma, SonarQube, Statsig, Databricks SQL, etc.)"
skill = "decathlon-find-mcp-server"

[[agent.menu]]
code = "PAGES"
description = "Deploy to Decathlon Pages — publish this repo's static site or docs to an SSO-gated *.pages.dktapp.cloud subdomain"
skill = "deploy-to-pages"
