[[agent.menu]]
code = "PHOTOS"
description = "Search Decathlon PixL DAM — find real product photos, lifestyle images, or campaign assets for mockups"
skill = "decathlon-pixl-search"

[[agent.menu]]
code = "MOCKUP"
description = "Generate a UI mockup using Vitamin Play via the web-ui-development skill"
prompt = """Generate a UI mockup following the Decathlon Vitamin Play design system.

1. Fetch the latest Vitamin Play design guidelines:
   `gh api repos/dktunited/vitamin-play-documentation/contents/raw/DESIGN.md --jq '.content' | base64 -d`
2. Ask the user: what screen, feature, or user journey should the mockup cover?
3. Invoke the `web-ui-development` skill to build the mockup using Vitamin Play components.
4. Apply the colour tokens, typography, spacing, and component patterns from DESIGN.md.
5. Verify WCAG 2.2 AA compliance (contrast, focus states, semantic structure).
6. Present the mockup with a brief annotation of the Vitamin Play components used."""

[[agent.menu]]
code = "UXR"
description = "UX research — plan or run a study the Decathlon way (framing, method, screener, protocol, moderation) via the ux-research skill"
skill = "ux-research"

[[agent.menu]]
code = "CD"
description = "Content design — create or review customer-facing UX copy, messages, screens, or flows"
skill = "content-design"

[[agent.menu]]
code = "SYNTH"
description = "Research synthesis — turn sessions into traceable, triangulated, confidence-graded findings, personas, journeys, JTBD, HMW or an OST"
prompt = """Synthesize user research evidence into decision-ready artefacts.

1. Invoke the `ux-research` skill — it is the mandatory Decathlon methodology for this work. Do not improvise an alternative synthesis framework or template.
2. Declare the evidence base first: qualitative sessions, quantitative sample size and date range, and named gaps. If a source type is missing, say so and continue — absence limits claims, it does not stop the work.
3. Cluster observations into candidate findings, with a source citation per observation (`references/attribution.md`). No anchor, no claim.
4. Triangulate every candidate finding across available source types (`references/triangulation.md`) and record convergence, divergence, qualification, or single-source status honestly.
5. Run the challenger audit (`references/challenger-audit.md`) for disconfirming instances, minority positions, subtle frictions, silence, and rival explanations. Record `searched: none found` rather than leaving it blank.
6. Grade confidence and state sample limits (`references/confidence-and-limits.md`).
7. Ask the user which deliverable the audience and decision require, then render it from the matching ux-research template (persona, journey, JTBD, HMW, OST, shareout, or debrief deck) — synthesize once, render many.
8. Ask whether the deliverable is wanted as markdown or as a web artefact. Markdown stays plain markdown. If it is to be an HTML page, an interactive prototype, a browser-served deck, or a clickable board, invoke `web-ui-development` and build it with Vitamin Play components and design tokens, then validate WCAG 2.2 AA / RGAA — never hand-rolled HTML/CSS.
9. Ship the evidence ledger, minority evidence, confidence grades, and open questions inside the deliverable, never as a footnote."""

[[agent.menu]]
code = "MCP"
description = "Browse MCP catalog — find and install available MCP servers (Atlassian/Jira, Datadog, Figma, SonarQube, Statsig, Databricks SQL, etc.)"
skill = "decathlon-find-mcp-server"
