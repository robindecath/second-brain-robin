# Benchmark: 3-Layer Merge Validation
#
# Validates that base (BMAD Method) + team (PR #16) + user (project) layers
# all merge correctly and both base and team principles/facts are present.
#
# The architecture uses a 3-layer TOML merge:
#   Layer 1 (Base): _bmad/bmm/skills/bmad-agent-architect/customize.toml
#   Layer 2 (Team): ./bmad-agent-architect.toml (this PR #16)
#   Layer 3 (User): .agents/skills/bmad-agent-architect/customize.toml (project overrides)
#
# Merge semantics:
#   - Scalars: Layer 3 > Layer 2 > Layer 1 (highest priority wins)
#   - Arrays: All layers append (combine)
#   - Objects: Deep merge at each level
#
# This benchmark tests that:
# - Base BMAD principles are present (architecture choice justification)
# - Team Decathlon principles are present (added by PR #16)
# - Both work together, not one overwriting the other
# - Facts from both layers are applied
#
# Run this benchmark:
#   benchmark run --config tests/bmad-merge-validation/3-layer-merge.yml
#
# Expected results:
#   ✓ prompt-1: Mentions base principle (tech choice justification)
#   ✓ prompt-2: Mentions team principle (Decathlon-specific rule)
#   ✓ prompt-3: Both base + team facts known
#   ✓ prompt-4: Sufficient total principles (4+ base, 2+ team)
#   ✓ Proves merge works: both layers applied, not overwritten

project: bmad-agent-architect

model: copilot/claude-haiku-4.5

pre_activate:
  command: >-
    uv run ${PROJECT_ROOT:-.}/_bmad/scripts/resolve_customization.py
    --skill ${ARCH_AGENT_SKILL_DIR:-./.agents/skills/bmad-agent-architect}
    --key agent
  var: resolved_agent

system_prompt: >-
  {resolved_agent}
  
  You have access to additional tools and skills.
  When a task matches a skill description, use the read_skill tool to load it.

skills:
  - name: bmad-agent-architect
    path: ${ARCH_AGENT_SKILL_DIR:-./.agents/skills/bmad-agent-architect}/SKILL.md

sub_skills:
  - name: decathlon-tech-radar
    path: ${TECH_RADAR_PATH:-./tests/bmad-agent-architect/stubs/decathlon-tech-radar.skill.yml}
  - name: knowledge-graph-query
    path: ${ASSET_KG_PATH:-./tests/bmad-agent-architect/stubs/knowledge-graph-query.skill.yml}

prompts:
  # ── Merge Validation 1: Base Layer Principles ───────────────────────────
  # Test that base BMAD principles are present (not overwritten by team layer)
  
  - id: merge-base-principle-tech-choice
    text: >-
      Load the bmad-agent-architect skill.
      
      What principle guides how you make technology choices in architecture?
      (This is a core BMAD method principle, not Decathlon-specific)
    
    asserts:
      - type: tool_called
        tool: read_skill
        times_min: 1
      # Base principle: Justify technology choice
      - type: response_contains_ignore_case
        value: "choice"

  # ── Merge Validation 2: Team Layer Principles ──────────────────────────
  # Test that team Decathlon principles are present (added by PR #16)
  
  - id: merge-team-principle-tech-radar
    text: >-
      Load the bmad-agent-architect skill.
      
      What is the Decathlon team's specific principle about technology selection?
      Which skill must you always consult?
      (This is a Decathlon team customization, not core BMAD)
    
    asserts:
      - type: tool_called
        tool: read_skill
        times_min: 1
      # Team principle: Always invoke tech-radar
      - type: response_contains
        value: "Decathlon Tech Radar"
      # Or mention the principle about ALWAYS invoking it
      - type: response_contains_ignore_case
        value: "always"

  # ── Merge Validation 3: Base + Team Facts Combined ────────────────────
  # Test that both base facts AND team facts are known
  
  - id: merge-base-fact-asset-registry
    text: >-
      Load the bmad-agent-architect skill.
      
      What do you know about the asset registry or AppReferential?
      (This is about existing Decathlon infrastructure from both base and team)
    
    asserts:
      - type: tool_called
        tool: read_skill
        times_min: 1
      # Base fact: There is an asset registry
      - type: response_contains_ignore_case
        value: "registry"
      # Team fact: It's called AppReferential
      - type: response_contains
        value: "AppReferential"

  # ── Merge Validation 4: Principles Count ───────────────────────────────
  # Test that we have BOTH base principles AND team additions
  # Base has ~4-5 core principles, team adds 2-3 more
  # If merge failed, we'd only have 4-5 (base only) or just 2-3 (team only)
  
  - id: merge-completeness-principle-count
    text: >-
      Load the bmad-agent-architect skill.
      
      List ALL the principles that guide your architecture decisions.
      Count them. Are there more than 5 principles total?
      
      (If merge worked: base principles (4-5) + team principles (2-3) = 6-8 total)
      (If base only: ~4-5 principles)
      (If team only: ~2-3 principles)
    
    asserts:
      - type: tool_called
        tool: read_skill
        times_min: 1
      # Should list many principles if both layers merged
      - type: response_contains_ignore_case
        value: "principle"

  # ── Merge Validation 5: Cross-Layer Consistency ──────────────────────────
  # Test that principles from different layers work together, not conflict
  
  - id: merge-consistency-radar-and-compliance
    text: >-
      Load the bmad-agent-architect skill.
      
      According to your principles, do you need to:
      1. Justify technology choices against the tech radar (team principle)
      2. Check compliance across domains (team principle)
      
      Are these two requirements compatible? Do they conflict?
    
    asserts:
      - type: tool_called
        tool: read_skill
        times_min: 1
      # Both principles should be known and compatible
      - type: response_contains_ignore_case
        value: "radar"
      - type: response_contains_ignore_case
        value: "compliance"

  # ── Merge Validation 6: Facts Completeness ────────────────────────────
  # Test that facts from both base and team layers are known
  
  - id: merge-facts-completeness
    text: >-
      Load the bmad-agent-architect skill.
      
      What facts do you have about:
      - Technology selection frameworks (base BMAD knowledge)
      - Decathlon's specific tech policies (team Decathlon knowledge)
      - Asset management and ownership (both base and team)
    
    asserts:
      - type: tool_called
        tool: read_skill
        times_min: 1
      # Should know about multiple knowledge domains
      - type: response_contains_ignore_case
        value: "technology"
      - type: response_contains
        value: "Decathlon"
      - type: response_contains_ignore_case
        value: "asset"

summary: |
  This benchmark validates the 3-layer TOML merge by testing that:
  
  ✓ Base BMAD principles are present (not overwritten)
  ✓ Team Decathlon principles are present (not missing)
  ✓ Base facts and team facts both known
  ✓ Principles from different layers work together
  ✓ No conflicts between base and team customizations
  ✓ Merge semantics correct: arrays append, not replace
  
  It proves that PR #16 customizations merge WITH base BMAD customizations,
  not REPLACE them. If merge failed, one layer would dominate.
  
  This addresses a critical test gap: "Do base + team layers actually merge?"
