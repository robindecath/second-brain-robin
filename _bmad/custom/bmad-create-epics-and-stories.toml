# Team overrides for bmad-create-epics-and-stories — Epic and story creation workflow
# Merged on top of .agents/skills/bmad-create-epics-and-stories/customize.toml
# Scalar values override defaults; arrays append to defaults.

[workflow]

activation_steps_prepend = [
  "For stories introducing a new system or changing data flow, identity, access, external integrations, or trust boundaries, load `_specs/threat-model.md` and `_specs/security-requirements.md` as required inputs. For routine operational or non-design stories with no such change (monitoring/alerting configuration, logging, CI/CD tweaks, dependency bumps, pure refactors, or documentation), skip the threat-model requirement. Preserve the architecture-defined risk contract: `_specs/threat-model.md` is the risk register and decision log, `_specs/security-requirements.md` is the normative control set, and `_specs/security-verification-checklist.md` remains the downstream evidence ledger when it already exists. Every in-scope risk and requirement must keep stable IDs and explicit cross-references in story acceptance criteria.",
]

activation_steps_append = [
  "If the architecture document references named Decathlon products, APIs, or components, invoke `knowledge-graph-query` to load authoritative integration context (endpoints, tech stack, team ownership, documentation links). Use this context to enrich story acceptance criteria with real constraints rather than assumptions.",
  "If a story implies calling or integrating with an internal capability without a specific API named in the architecture (e.g. 'retrieve stock levels', 'submit an order'), invoke `decathlon-api-discovery` to check whether an existing API/endpoint already covers it before drafting acceptance criteria around a new integration.",
]

persistent_facts = [
  "For stories that create or change customer-facing UI content, use `content-design` to define or review the relevant copy, component text, error/validation guidance, content hierarchy, and user-flow wording. Story acceptance criteria should make content behaviour and constraints testable (including terminology, accessibility, and actionable recovery) without turning assumptions into final copy. The skill excludes marketing, slogans, legal/compliance copy, and translation/localisation.",
  "User-facing stories must stay traceable to their research evidence. When a story's value hinges on a user need, behaviour, or pain point, cite the `ux-research` finding behind it (citation, triangulation status, confidence grade) rather than restating it as fact. A story built on a low-confidence or single-source finding is scoped as an experiment with a measurable learning goal, not as a committed build. If no evidence exists, write the assumption explicitly into the story and route it to `ux-research` — Decathlon's canonical and exclusive research methodology — instead of inventing a justification or a different validation approach.",
  "Stories involving web UI must include explicit accessibility acceptance criteria aligned with WCAG 2.2 AA / RGAA. Accessibility is delivery scope, not a post-launch add-on — it must appear in acceptance criteria before story commitment.",
  "Stories involving integration with Decathlon APIs or services must reference the AppReferential asset name and include the owning team as a stakeholder or notify contact.",
  "Stories that introduce new technologies must reference a Tech Radar classification (ADOPT / TRIAL / ASSESS). HOLD technologies must not appear in story scope.",
  "Epics that introduce new products or significant new components should include a story for AppReferential registration (domain, tiering, team ownership, SLO baseline).",
  "All non-trivial stories must reference applicable security requirements from `_specs/security-requirements.md` in their acceptance criteria using stable requirement IDs.",
  "Every in-scope risk from `_specs/threat-model.md` must appear on the feature story with its stable risk ID, current status (`open`, `mitigated`, `accepted`, or `blocked`), mapped requirement IDs, and the evidence or acceptance outcome that will close it. Do not create separate security stories — mitigations belong on the feature story unless intentionally split as dependent delivery work.",
  "All in-scope risks must be explicit acceptance criteria on the feature story that introduces the risk. Apply the same handling rules to every risk: a story is not ready until each risk has defined mitigation work with traceable evidence expectations or an explicit acceptance path. Every mitigation action must be defined for implementation; if a mitigation action cannot be implemented as planned, the story must record the blocker, evaluate alternative or compensating controls, and either implement an alternative mitigation, defer deployment, or explicitly accept the residual risk. P0 risks on production-grade applications should be reviewed by the team's security officer. The only intended difference between severities is prioritization order.",
  "If a story is expected to ship with an accepted risk, its acceptance criteria must require an acceptance record in `_specs/threat-model.md` with at least the risk ID, rationale, accepting application owner, decision date, review date, and linked compensating controls or evidence.",
  "Story acceptance criteria must prevent orphan traceability: every referenced requirement must trace back to at least one risk ID, and every planned verification item or evidence expectation must trace to both requirement and risk IDs.",
]

# On-demand sources consulted during epic and story elaboration.
external_sources = [
  "When an epic or story requires customer-facing UI copy, microcopy, content hierarchy, screen information architecture, or user-flow wording, invoke `content-design` to guide the content and derive testable acceptance criteria. Do not use it for marketing, slogans, legal/compliance copy, or translation/localisation. If the skill is not installed, tell the user to run: `npx skills add dktunited/agent-skills --skill content-design`",
  "When a story or epic needs the user evidence behind it — the originating persona, journey step, job-to-be-done, opportunity, or finding confidence — or when the elaboration reveals an unvalidated user assumption that needs a study, consult `ux-research` and use its templates and confidence vocabulary. Do not improvise a research or validation approach. If the skill is not installed, tell the user to run: `npx skills add dktunited/agent-skills --skill ux-research`",
  "When the user mentions an external tool or platform — or asks about available MCPs — invoke `decathlon-find-mcp-server`. If the skill is not installed, tell the user to run: `npx skills add dktunited/ai-augmented-sdlc --skill decathlon-find-mcp-server`",
  "When the user asks about AI Augmented Development at Decathlon — GitHub Copilot usage, billing or quota, the AI Augmented SDLC platform, coding standards, agent skills, MCP servers, trainings, talks or monthly community calls — consult the official documentation via `decathlon-ai-augmented-development-docs`, which reads the versioned `llms-full.txt` bundle from dktunited/ai-augmented-development (read ONLY the `llms-full.txt` files — never the link-only `llms.txt`/`llms-pages.txt` indexes, which point back to the login-gated site). If the skill is not installed, tell the user to run: `npx skills add dktunited/ai-augmented-sdlc --skill decathlon-ai-augmented-development-docs`",
  "When a story involves integrating with a Decathlon product or API, consult `knowledge-graph-query` to retrieve the asset's tech stack, documentation links, and team ownership for use in acceptance criteria.",
  "When a story touches User Journey performance, consult `delivery-metrics` to retrieve current UJ SLO baselines and identify which Moments are impacted — use this to set measurable acceptance criteria.",
  "When a story implies calling an internal capability without naming a specific API/endpoint, consult `decathlon-api-discovery` to identify the real API/endpoint that covers it before writing acceptance criteria.",
]
