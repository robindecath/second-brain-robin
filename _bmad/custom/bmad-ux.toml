# Team overrides for bmad-ux — UX design workflow
# Merged on top of .agents/skills/bmad-ux/customize.toml
# Scalar values override defaults; arrays append to defaults.
#
# IMPORTANT: "UX" here is not synonymous with "web frontend". Vitamin Play and WCAG/RGAA
# are web-frontend-specific quality gates. For CLI, API, and MCP-server projects with no
# browser surface, forcing those gates produces irrelevant activation chatter (invoking
# web-ui-development / web-accessibility-evaluation for a project with no HTML/CSS) and
# skips the UX work that actually matters for that surface: command/flag ergonomics, help
# text clarity, output schema consistency, and the error-message contract. The interface-
# type check below must run BEFORE any Vitamin Play/WCAG step is invoked.

[workflow]

activation_steps_prepend = [
  "FIRST determine this project's interface type from the architecture doc / project-context (look for a web/browser frontend framework — React, Vue, Svelte, Next.js, Astro, or plain HTML/CSS — vs a CLI, API-only, or MCP-server surface with no browser UI). State the determination explicitly to the user. ONLY if a web/browser frontend surface exists, invoke `web-ui-development` to load the Vitamin Play design system (components, design tokens, icon library, Tailwind theme values) — all UI design decisions must then be grounded in Vitamin Play components, custom CSS colors/spacing/typography from scratch are not permitted. If the project is CLI, API, or MCP-server only (no browser surface), do NOT invoke web-ui-development or treat Vitamin Play as applicable — instead scope the UX work to: command/subcommand structure and flag naming, help/usage text clarity, output format consistency (e.g. JSON schema stability, exit codes), and the error-message contract (code + message + context + remediation).",
]

activation_steps_append = [
  "Establish the evidence base before any design decision. Invoke the `ux-research` skill — Decathlon's canonical and exclusive research methodology — and state explicitly what user evidence exists for this work (prior studies, analytics, support feedback, interviews) and what is assumption. This step is interface-agnostic: it applies to web, CLI, API, and MCP-server projects alike, because it is about users, not about a browser surface. If evidence is missing for a need the design depends on, say so and scope a study with `ux-research` (its method-selection reference) instead of designing on an assumed need or inventing a research approach of your own.",
]

persistent_facts = [
  "`content-design` is Decathlon's canonical skill for customer-facing UX content. Invoke it whenever this phase creates, reviews, or improves UI copy or microcopy, buttons, labels, helper text, validation or error messages, empty states, content hierarchy, screen information architecture, user flows, or copy variants. Follow its UK English, accessible and user-focused language, consistent terminology, and actionable recovery guidance. It excludes marketing, slogans, legal/compliance copy, and translation/localisation; recommend the relevant human specialist for those and human Content Design review for critical checkout/payment changes, accessibility or inclusion concerns, sensitive content, legal requirements, or repeated rejected suggestions without clear feedback. If not installed, tell the user to run `npx skills add dktunited/agent-skills --skill content-design`.",
  "`ux-research` is Decathlon's canonical and MANDATORY UX research methodology, and it is exclusive: every research or discovery activity in this phase — framing the decision, choosing a method, writing a screener or recruitment message, building an interview or usability protocol, moderating sessions, cleaning transcripts, running flash debriefs, synthesizing findings, triangulating sources, auditing for counter-evidence, grading confidence, and producing personas, journeys, jobs-to-be-done, How-Might-We sets, opportunity solution trees, shareouts or debrief decks — must be run through the `ux-research` skill using its bundled `references/` rules and `assets/` templates. Proposing a different research framework, an improvised protocol, or a home-made persona/journey template is not acceptable, even if it looks equivalent.",
  "ux-research applies to every interface type. Vitamin Play and WCAG gate the web surface only, but user research gates all of them — a CLI, API, or MCP-server project still has users whose behaviour, mental models, and frictions must be evidenced rather than assumed.",
  "Non-negotiable ux-research quality floor for every UX deliverable in this phase: start from the decision, not the solution; prefer observed behaviour over stated preference; no observation without a source citation; triangulate a candidate finding before calling it a finding; run the challenger audit for disconfirming, minority, and silent evidence (record `searched: none found` rather than leaving it blank); grade confidence and ship sample limits and open questions inside the artefact; give minority and contradictory evidence a named section, row, or slide — never a footnote and never cut for time; keep participants anonymous; never fabricate quotes, numbers, participants, or personas; never report \"4 out of 6 users\" style statistics from a small qualitative sample as a measurement.",
  "ux-research modeling thresholds and formats: skip personas below ~8 qualitative sessions and produce a jobs-to-be-done set or a single-actor journey instead; journeys must carry stages, touchpoints, actions, emotions, pain points, moments of truth, and evidence per row; a usability test evaluates observed tasks, never attitudinal opinion questions about a prototype. Synthesize once and render many — route the same synthesis to the shareout, debrief deck, journey, persona, JTBD, HMW, or OST template the audience needs, instead of re-synthesizing per deliverable.",
  "RENDERING RULE — markdown vs. web artefact: `ux-research` templates are markdown deliverables and stay plain markdown; Vitamin Play does not apply to them, and their absence of design-system styling is not a gap. But the moment you build a NEW web deliverable off the back of research — an HTML page, an interactive or clickable prototype, a browser-served deck, a persona/journey board, an opportunity-tree canvas, or a shareout microsite — it IS a Decathlon web surface: invoke `web-ui-development`, compose it from Vitamin Play components and design tokens (never ad-hoc HTML/CSS or a generic web template), and apply WCAG 2.2 AA / RGAA. This overrides the interface-type determination made at activation: even on a CLI, API, or MCP-server project, a research or design deliverable shipped as a web page is a web surface and must follow Vitamin Play and WCAG — the interface-type gate governs the PRODUCT being designed, not the artefacts used to communicate about it. SCOPE LIMIT: this covers new deliverables you create, not artefacts BMAD already produces by default — leave those exactly as the workflow generates them, do not restyle or rebuild them onto the design system, and do not flag them as a gap.",
  "Decathlon's design system is Vitamin Play (@vtmn-play/* packages) — applies ONLY when the project has a web/browser frontend surface. All UI elements in that case must use Vitamin Play components and design tokens; custom CSS that replicates what Vitamin Play already provides is not acceptable.",
  "WCAG 2.2 AA / RGAA accessibility compliance is mandatory for all Decathlon WEB interfaces. Accessibility decisions must be explicit in the UX deliverables — they cannot be deferred to implementation. An accessibility review via `web-accessibility-evaluation` is required before UX sign-off for web frontends.",
  "For CLI, API, and MCP-server projects with no web/browser surface, WCAG/RGAA and Vitamin Play do not apply — do not flag their absence as a UX gap. Instead the UX deliverable must define and validate a non-web accessibility/usability floor: clear, jargon-free language in help text and error messages; no color-only signaling (status must also be conveyed by text/symbol, since ANSI colors may be disabled or unsupported); consistent, predictable output structure (stable JSON keys/field ordering, documented schema); and discoverable, example-driven help output (`--help` at every level).",
  "When designing forms, apply Decathlon form patterns: react-hook-form + Zod for React, sveltekit-superforms + Zod for Svelte, vee-validate + Zod for Vue — all aligned with Vitamin Play. This applies only to web frontends with actual form UI.",
]

# Finalize-time doc-standards pass (BMad-documented field: entries are `skill:`,
# `file:`, or plain-text directives, run as parallel subagents before the user
# sees the output). Kept as a plain-text conditional directive (not a bare
# `skill:web-accessibility-evaluation` entry) so a CLI/API/MCP project doesn't
# unconditionally trigger a web-only accessibility skill.
doc_standards = [
  "Deliverable-rendering review: determine the form of each UX/research deliverable. Markdown artefacts are exempt from design-system checks — do not flag them. Artefacts BMAD produces by default are also out of scope — do not flag them and do not ask for them to be restyled. For any NEW web deliverable built off the back of this phase (HTML page, interactive prototype, browser-served deck, persona/journey board, opportunity-tree canvas, shareout microsite), verify it was built with `web-ui-development` using Vitamin Play components and design tokens rather than ad-hoc HTML/CSS or a generic template, and that WCAG 2.2 AA / RGAA was validated on it. This applies even when the product itself is a CLI, API, or MCP server. Treat a hand-rolled, off-design-system web deliverable as a blocking finding.",
  "Research-evidence review (applies to every interface type, web or not): audit the UX deliverables against the `ux-research` quality check before sign-off. Verify that every user-need, pain-point, persona, journey row, JTBD, HMW, or opportunity claim resolves to a source citation; that candidate findings were triangulated where triangulation was possible; that a counter-evidence search was run and recorded; that confidence grades and sample limits ship inside the artefact; that minority and contradictory evidence has named space rather than a footnote; that no quote, number, participant, or persona was fabricated; that small-sample qualitative signals are not reported as measurements; and that no participant is named or identifiable. Treat a fabricated or uncited claim, an unaudited finding set, or a persona built on fewer than ~8 qualitative sessions as a blocking finding. Do not accept an alternative research framework as a substitute for this floor.",
  "If this project has a web/browser frontend surface, invoke the `web-accessibility-evaluation` skill as a mandatory reviewer against the UX deliverables before sign-off. If the project is CLI, API, or MCP-server only (no browser surface), do NOT invoke web-accessibility-evaluation — instead review the deliverables against the non-web accessibility/usability floor from persistent_facts (jargon-free language, no color-only signaling, stable output schema, discoverable help) and report findings the same way a web accessibility review would.",
]

# On-demand sources consulted during UX design. Both entries are web-frontend-specific
# and should only be consulted when the interface-type check above found a web surface.
external_sources = [
