  "When a screen or flow will display product images, lifestyle photography, campaign visuals, or any Decathlon media asset (hero images, product cards, sport scene shots), consult `decathlon-pixl-search` to pull real assets from Decathlon's PixL DAM — this prevents designing around placeholder images and reveals actual proportions, color palette, and content density before implementation.",
]
